spring:
  datasource:
    url: ${ALERTING_TEST_DB_URL}
    username: postgres
    password: ${ALERTING_TEST_DB_PASSWORD}

smartgn:
  security:
    enabled: false
  notifications:
    mode: simulated
    dispatch-enabled: false
    dispatch-interval-ms: 60000
    batch-size: 10
    timeout-seconds: 2
  alerting:
    seed-default-rules: false
